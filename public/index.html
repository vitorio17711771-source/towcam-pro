<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>TowCam Pro | Kamera testi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#f5f5f5;font:16px system-ui,sans-serif}main{max-width:620px;margin:auto;padding:16px 16px max(16px,env(safe-area-inset-bottom))}h1{font-size:22px;margin:0}small{color:#b9bcc5}video,img{display:block;width:100%;max-height:65dvh;object-fit:contain;background:#08090b;border-radius:16px}video{margin-top:18px}img[hidden]{display:none}.controls{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap}button,a.save{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:#333840;color:white;text-decoration:none}button.primary{background:#f1ca76;color:#171717;font-weight:700}button:disabled{opacity:.45}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 system-ui;color:#c4c9d2}p{font-size:14px;line-height:1.5;color:#c4c9d2}.status{color:#f1ca76}
</style>
</head>
<body><main>
<h1>TowCam Pro</h1><small>WORK 01 · Kamera fizibilite testi</small>
<video id="preview" autoplay playsinline muted></video>
<div class="controls"><button id="start">Kamerayı aç</button><button id="shoot" class="primary" disabled>Fotoğraf çek</button><button id="stop" disabled>Kapat</button></div>
<p id="status" class="status" role="status">Kamera başlatılıyor…</p>
<img id="result" alt="Son çekilen test fotoğrafı" hidden>
<div class="controls"><a id="save" class="save" hidden>Orijinal çekimi indir</a></div>
<pre id="info"></pre>
<p>Bu ilk test sürümü yalnızca kameranın erişilebilirliğini ve gerçek çekim çözünürlüğünü ölçer. Profesyonel iyileştirme ve PWA kurulumu henüz eklenmemiştir. Fotoğraf sunucuya gönderilmez.</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const video=$('preview'), status=$('status'), info=$('info'), result=$('result'), save=$('save'), startButton=$('start'), shootButton=$('shoot'), stopButton=$('stop');
let stream=null, imageURL=null, generation=0, busy=false;
function stop(){generation++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;startButton.disabled=false;shootButton.disabled=true;stopButton.disabled=true;}
async function start(){
  if(stream||busy)return;
  const token=++generation;busy=true;startButton.disabled=true;
  status.textContent='Kamera izni bekleniyor…';info.textContent='';
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('Kamera API erişimi yok; HTTPS ve tarayıcı izinlerini kontrol edin.');
    const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}}});
    if(token!==generation){s.getTracks().forEach(t=>t.stop());return;}
    stream=s;video.srcObject=s;await video.play();
    const t=s.getVideoTracks()[0],settings=t.getSettings();
    let cap;try{cap=t.getCapabilities?.()}catch{}
    let captureInfo='ImageCapture: '+(typeof window.ImageCapture==='function'?'var':'yok');
    if(typeof window.ImageCapture==='function'){
      try{const c=new ImageCapture(t);const p=await c.getPhotoCapabilities();captureInfo+='\nBildirilen fotoğraf boyutu üst sınırı: '+(p.imageWidth?.max??'?')+' × '+(p.imageHeight?.max??'?');}catch{captureInfo+=' (fotoğraf yetenekleri okunamadı)';}
    }
    if(token!==generation)return;
    info.textContent='Kamera: '+t.label+'\nÖnizleme: '+(settings.width??video.videoWidth)+' × '+(settings.height??video.videoHeight)+'\nBildirilen video üst sınırı: '+(cap?.width?.max??'?')+' × '+(cap?.height?.max??'?')+'\n'+captureInfo;
    shootButton.disabled=false;stopButton.disabled=false;status.textContent='Kamera hazır.';
  }catch(e){stop();status.textContent='Kamera açılamadı: '+(e.message||e.name)+' — izinleri kontrol edip tekrar deneyin.';}
  finally{busy=false;}
}
async function shoot(){
  if(!stream||busy)return;busy=true;shootButton.disabled=true;stopButton.disabled=true;
  const token=generation,t0=performance.now();
  status.textContent='Çekiliyor…';
  try{
    let blob=null,method='ImageCapture.takePhoto';
    if(typeof window.ImageCapture==='function'){
      try{const c=new ImageCapture(stream.getVideoTracks()[0]);try{const p=await c.getPhotoCapabilities();const w=p.imageWidth?.max,h=p.imageHeight?.max;if(w>0&&h>0)blob=await c.takePhoto({imageWidth:w,imageHeight:h});}catch{}if(!blob)blob=await c.takePhoto();}catch{}
    }
    if(!blob){
      method='Video karesi (düşük çözünürlüklü yedek yöntem)';
      if(!video.videoWidth||!video.videoHeight)throw new Error('Kamera görüntüsü hazır değil.');
      const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;
      canvas.getContext('2d').drawImage(video,0,0);
      blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.98));canvas.width=canvas.height=0;
    }
    if(!blob)throw new Error('Fotoğraf oluşturulamadı.');
    if(token!==generation)return;
    const next=URL.createObjectURL(blob);
    try{
      const image=new Image();image.src=next;await image.decode();
      if(token!==generation){URL.revokeObjectURL(next);return;}
      if(imageURL)URL.revokeObjectURL(imageURL);imageURL=next;
      result.src=next;result.hidden=false;save.href=next;save.download='TowCam-original-'+Date.now()+'.'+(blob.type==='image/png'?'png':'jpg');save.hidden=false;
      status.textContent=method+' · '+image.naturalWidth+' × '+image.naturalHeight+' · '+(blob.size/1048576).toFixed(2)+' MB · '+((performance.now()-t0)/1000).toFixed(2)+' sn';
    }catch(e){URL.revokeObjectURL(next);throw e;}
  }catch(e){status.textContent='Çekim başarısız: '+e.message;}
  finally{busy=false;shootButton.disabled=!stream;stopButton.disabled=!stream;}
}
startButton.onclick=start;shootButton.onclick=shoot;stopButton.onclick=()=>{stop();status.textContent='Kamera kapatıldı.'};
window.addEventListener('pagehide',()=>{stop();if(imageURL){URL.revokeObjectURL(imageURL);imageURL=null;result.hidden=true;save.hidden=true;}});
start();
</script></body></html>
